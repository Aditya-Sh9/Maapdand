{% load ui %}{# 4px of padding around the words so the border never cuts through the letters #}<span class="evbox{% if css %} evbox--{{ css }}{% endif %}" data-field="{{ field }}" title="{{ label }}" style="left: calc({{ bbox.0|pct }} - 4px); top: calc({{ bbox.1|pct }} - 4px); width: calc({{ bbox.2|pct }} + 8px); height: calc({{ bbox.3|pct }} + 8px);">{% if tag %}<span class="evbox__tag">{{ tag }}</span>{% endif %}</span>
