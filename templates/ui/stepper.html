{# Progress through the four stages. Screen readers hear "Step 3 of 4: Review". #}
<nav class="stepper" aria-label="Progress" data-current="{{ current }}">
  <ol>
    {% for s in steps %}
    <li class="stepper__step is-{{ s.state }}"{% if s.state == "current" %} aria-current="step"{% endif %}>
      <span class="stepper__dot" aria-hidden="true">{% if s.state == "done" %}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>{% else %}{{ s.number }}{% endif %}</span>
      <span class="stepper__name"><span class="visually-hidden">Step {{ s.number }} of 4: </span>{{ s.name }}{% if s.state == "done" %}<span class="visually-hidden"> (done)</span>{% endif %}</span>
    </li>
    {% endfor %}
  </ol>
  <span class="stepper__track" aria-hidden="true"><span class="stepper__fill"></span></span>
</nav>
