<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Maapdand context diagram (DFD level 0)</title>
  <desc id="d">The user sends label images or text and corrections to Maapdand. Maapdand reads the Legal Metrology rules, keeps scan history, and returns Pass, Fail or Cannot determine verdicts with evidence and a PDF report.</desc>
  <style>
    text { font-family: "Noto Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1B2421; }
    .title { font-family: "Source Serif 4", Georgia, serif; font-size: 20px; font-weight: 600; }
    .sub { font-size: 12px; fill: #566059; }
    .lbl { font-size: 12px; fill: #566059; }
    .nm { font-size: 14px; font-weight: 600; }
    .box { fill: #FFFFFF; stroke: #DDD8CC; stroke-width: 1.5; }
    .proc { fill: #E7F0EE; stroke: #0F6B5C; stroke-width: 2; }
    .flow { fill: none; stroke: #0F6B5C; stroke-width: 2; stroke-dasharray: 7 6; animation: dash 1.2s linear infinite; }
    .rule { stroke: #C48A1C; }
    .dot { fill: #0F6B5C; }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6B5C"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C48A1C"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="20" fill="#F6F3EC"/>
  <text x="32" y="40" class="title">Context diagram (DFD level 0)</text>
  <text x="32" y="60" class="sub">One system, one user, two data stores.</text>

  <!-- External entity: user -->
  <rect x="32" y="150" width="150" height="80" rx="6" class="box"/>
  <text x="107" y="184" text-anchor="middle" class="nm">User</text>
  <text x="107" y="204" text-anchor="middle" class="sub">inspector, seller, student</text>

  <!-- Process 0 -->
  <rect x="380" y="130" width="210" height="120" rx="18" class="proc"/>
  <text x="485" y="172" text-anchor="middle" class="sub">0</text>
  <text x="485" y="195" text-anchor="middle" class="nm" style="font-size:17px">Maapdand</text>
  <text x="485" y="216" text-anchor="middle" class="sub">label compliance checker</text>

  <!-- Data store: rules (top) -->
  <path d="M380 66 H590 M380 110 H590" stroke="#C48A1C" stroke-width="2" fill="none"/>
  <path d="M380 66 V110" stroke="#C48A1C" stroke-width="2" fill="none"/>
  <rect x="380" y="66" width="210" height="44" fill="#FFFFFF" fill-opacity="0.6"/>
  <text x="485" y="93" text-anchor="middle" class="nm" style="font-size:13px">D1  Legal Metrology rules</text>

  <!-- Data store: history (bottom) -->
  <path d="M380 290 H590 M380 334 H590 M380 290 V334" stroke="#C48A1C" stroke-width="2" fill="none"/>
  <rect x="380" y="290" width="210" height="44" fill="#FFFFFF" fill-opacity="0.6"/>
  <text x="485" y="317" text-anchor="middle" class="nm" style="font-size:13px">D2  Scans and results</text>

  <!-- External entity: report -->
  <rect x="778" y="150" width="150" height="80" rx="6" class="box"/>
  <text x="853" y="184" text-anchor="middle" class="nm">Report</text>
  <text x="853" y="204" text-anchor="middle" class="sub">on screen + PDF</text>

  <!-- Flows -->
  <path id="f1" class="flow" d="M182 175 H380" marker-end="url(#a)"/>
  <text x="281" y="166" text-anchor="middle" class="lbl">label images / text</text>
  <path id="f2" class="flow" d="M380 210 H182" marker-end="url(#a)"/>
  <text x="281" y="232" text-anchor="middle" class="lbl">review form</text>

  <path id="f3" class="flow rule" d="M485 110 V130" marker-end="url(#am)"/>
  <path id="f4" class="flow rule" d="M485 250 V290" marker-start="url(#am)" marker-end="url(#am)"/>

  <path id="f5" class="flow" d="M590 190 H778" marker-end="url(#a)"/>
  <text x="684" y="180" text-anchor="middle" class="lbl">Pass / Fail /</text>
  <text x="684" y="210" text-anchor="middle" class="lbl">Cannot determine + evidence</text>

  <!-- Moving data dots -->
  <circle r="5" class="dot"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#f1"/></animateMotion></circle>
  <circle r="5" class="dot"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#f5"/></animateMotion></circle>

  <!-- Verdict legend -->
  <g transform="translate(32 318)">
    <circle cx="6" cy="6" r="6" fill="#2F8A57"/><text x="20" y="10" class="sub">Pass</text>
    <circle cx="76" cy="6" r="6" fill="#C2473B"/><text x="90" y="10" class="sub">Fail</text>
    <circle cx="146" cy="6" r="6" fill="#C48A1C"/><text x="160" y="10" class="sub">Cannot determine</text>
  </g>
</svg>
